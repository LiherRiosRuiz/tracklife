http:
  middlewares:
    sec-baseline:
      headers:
        contentTypeNosniff: true          # X-Content-Type-Options: nosniff
        frameDeny: true                   # X-Frame-Options: DENY
        referrerPolicy: "strict-origin-when-cross-origin"
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=()"

    sec-csp-app:
      headers:
        contentSecurityPolicy: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; connect-src 'self' http://api.tracklife.test"

    sec-csp-api:
      headers:
        contentSecurityPolicy: "default-src 'none'; frame-ancestors 'none'"

    sec-hsts:
      headers:
        stsSeconds: 15552000
        stsIncludeSubdomains: true
        stsPreload: false

    dashboard-auth:
      basicAuth:
        usersFile: "/etc/traefik/dashboard_users"
        realm: "TrackLife admin"
        removeHeader: true

    internal-only:
      ipAllowList:
        sourceRange:
          - "192.168.20.0/24"
          - "127.0.0.1/32"
