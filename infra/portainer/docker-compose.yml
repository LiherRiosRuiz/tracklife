services:
  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer-linux
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.test`)"
      - "traefik.http.routers.portainer.entrypoints=web"
      - "traefik.http.routers.portainer.middlewares=internal-only@file"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
    # Bind loopback-only: the allowlist on the Traefik router would otherwise be
    # bypassable by hitting this published port directly.
    ports:
      - "127.0.0.1:9100:9000"

volumes:
  portainer_data:

networks:
  traefik_net:
    external: true
